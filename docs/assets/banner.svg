<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="title desc">
  <title id="title">PDFMaster</title>
  <desc id="desc">The professional PDF workspace that never leaves your machine.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="52%" stop-color="#132033"/>
      <stop offset="100%" stop-color="#0f4a45"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="92%" r="58%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8eef6"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1280" height="480" fill="url(#bg)"/>
  <rect width="1280" height="480" fill="url(#glow)"/>
  <path d="M0 0h1280v480H0z" fill="none"/>

  <!-- Fine grid, like a drafting table -->
  <g opacity="0.07" stroke="#94a3b8" stroke-width="1">
    <path d="M40 0v480M80 0v480M120 0v480M160 0v480M200 0v480M240 0v480M280 0v480M320 0v480M360 0v480M400 0v480M440 0v480M480 0v480M520 0v480M560 0v480M600 0v480"/>
    <path d="M0 40h640M0 80h640M0 120h640M0 160h640M0 200h640M0 240h640M0 280h640M0 320h640M0 360h640M0 400h640M0 440h640"/>
  </g>

  <!-- Wordmark -->
  <text x="72" y="168" fill="#99f6e4" font-family="Georgia, 'Times New Roman', serif" font-size="18" letter-spacing="6">REMO CONSULTANTS</text>
  <text x="72" y="248" fill="#f8fafc" font-family="Georgia, 'Times New Roman', serif" font-size="72">PDFMaster</text>
  <text x="74" y="302" fill="#cbd5e1" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-style="italic">The desk, not the cloud.</text>
  <text x="74" y="360" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" letter-spacing="0.4">Windows · Offline-first · MIT · v0.7.0</text>

  <!-- Stylized page stack -->
  <g filter="url(#soft)" transform="translate(820 78)">
    <rect x="36" y="28" width="248" height="318" rx="6" fill="#0f172a" opacity="0.35"/>
    <rect x="18" y="14" width="248" height="318" rx="6" fill="#1e293b"/>
    <rect x="0" y="0" width="248" height="318" rx="6" fill="url(#page)"/>
    <rect x="22" y="28" width="160" height="8" rx="4" fill="#cbd5e1"/>
    <rect x="22" y="48" width="204" height="7" rx="3.5" fill="#e2e8f0"/>
    <rect x="22" y="66" width="188" height="7" rx="3.5" fill="#e2e8f0"/>
    <rect x="22" y="92" width="148" height="18" rx="3" fill="#fde047" opacity="0.55"/>
    <rect x="22" y="122" width="204" height="7" rx="3.5" fill="#e2e8f0"/>
    <rect x="22" y="140" width="172" height="7" rx="3.5" fill="#e2e8f0"/>
    <rect x="22" y="158" width="196" height="7" rx="3.5" fill="#e2e8f0"/>
    <rect x="22" y="176" width="120" height="7" rx="3.5" fill="#e2e8f0"/>
    <rect x="22" y="210" width="204" height="7" rx="3.5" fill="#e2e8f0"/>
    <rect x="22" y="228" width="168" height="7" rx="3.5" fill="#e2e8f0"/>
    <rect x="22" y="246" width="188" height="7" rx="3.5" fill="#e2e8f0"/>
    <rect x="22" y="278" width="64" height="6" rx="3" fill="#0f766e"/>
  </g>
</svg>
